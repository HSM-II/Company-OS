openapi: 3.1.0
info:
  title: HSM-II Company OS API
  version: 0.1.0
  summary: Public HTTP contract for Company OS workspaces, tasks, goals, agents, memory, and agent chat.
  description: >
    This OpenAPI document is written as a public interface contract. It covers the stable
    Company OS API endpoints exposed by the HSM console server without exposing the private
    server implementation.
servers:
  - url: https://api.hsm-ii.example
    description: Hosted Company OS API
  - url: http://localhost:8765
    description: Local hsm_console development server
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Companies
  - name: Goals
  - name: Tasks
  - name: Agents
  - name: Memory
  - name: Agent Chat
  - name: Board
  - name: Runtime Daemons
  - name: Agent Runs
  - name: Dead Star
  - name: Connectors
paths:
  /api/company/health:
    get:
      tags: [Health]
      summary: Check Company OS API and database health.
      security: []
      operationId: getCompanyHealth
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/company/companies:
    get:
      tags: [Companies]
      summary: List companies.
      operationId: listCompanies
      responses:
        "200":
          description: Company list.
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
    post:
      tags: [Companies]
      summary: Create a company workspace.
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Created company.
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company:
                    $ref: "#/components/schemas/Company"
                  bootstrap:
                    type: object
                    additionalProperties: true
        "409":
          $ref: "#/components/responses/Error"
  /api/company/companies/{company_id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Companies]
      summary: Get a company.
      operationId: getCompany
      responses:
        "200":
          description: Company.
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company:
                    $ref: "#/components/schemas/Company"
    patch:
      tags: [Companies]
      summary: Update a company.
      operationId: updateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Updated company.
          content:
            application/json:
              schema:
                type: object
                required: [company]
                properties:
                  company:
                    $ref: "#/components/schemas/Company"
    delete:
      tags: [Companies]
      summary: Delete a company workspace.
      operationId: deleteCompany
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/dashboard:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Companies]
      summary: Get the Company OS dashboard snapshot.
      operationId: getCompanyDashboard
      responses:
        "200":
          description: Dashboard summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/api-catalog:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Companies]
      summary: Discover the Company OS HTTP API surface for a workspace.
      operationId: getCompanyApiCatalog
      responses:
        "200":
          description: API catalog and interface model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/export:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Companies]
      summary: Export a company bundle.
      operationId: exportCompany
      responses:
        "200":
          description: Company export bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/board:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Board]
      summary: Get Statica-style board state for a workspace.
      operationId: getBoard
      responses:
        "200":
          description: Board columns, task cards, and agent roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/board/columns:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Board]
      summary: Get board column definitions.
      operationId: getBoardColumns
      responses:
        "200":
          description: Board column definitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/board/presence:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Board]
      summary: Get live agent board presence.
      operationId: getBoardPresence
      responses:
        "200":
          description: Agent presence and current task assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/goals:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Goals]
      summary: List goals.
      operationId: listGoals
      responses:
        "200":
          description: Goal list.
          content:
            application/json:
              schema:
                type: object
                required: [goals]
                properties:
                  goals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Goal"
    post:
      tags: [Goals]
      summary: Create a goal.
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Created goal.
          content:
            application/json:
              schema:
                type: object
                required: [goal]
                properties:
                  goal:
                    $ref: "#/components/schemas/Goal"
  /api/company/companies/{company_id}/goals/{goal_id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/GoalId"
    patch:
      tags: [Goals]
      summary: Update a goal.
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: Updated goal.
          content:
            application/json:
              schema:
                type: object
                required: [goal]
                properties:
                  goal:
                    $ref: "#/components/schemas/Goal"
  /api/company/companies/{company_id}/tasks:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Tasks]
      summary: List tasks.
      operationId: listTasks
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: agent
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Task list.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
    post:
      tags: [Tasks]
      summary: Create a task.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task.
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
  /api/company/companies/{company_id}/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/TaskId"
    delete:
      tags: [Tasks]
      summary: Delete a task.
      operationId: deleteTask
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/tasks/{task_id}/state:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [Tasks]
      summary: Update task state.
      operationId: updateTaskState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskStateRequest"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
  /api/company/tasks/{task_id}/decision:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      summary: Record an operator policy decision for a task.
      operationId: decideTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDecisionRequest"
      responses:
        "200":
          description: Task after decision.
          content:
            application/json:
              schema:
                type: object
                required: [task, decision_mode]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
                  decision_mode:
                    type: string
  /api/company/tasks/{task_id}/requires-human:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      summary: Add or remove a task from the human review queue.
      operationId: setTaskRequiresHuman
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequiresHumanRequest"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
  /api/company/tasks/{task_id}/events:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      summary: List task audit events.
      operationId: listTaskEvents
      responses:
        "200":
          description: Task event list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/agents:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Agents]
      summary: List company agents.
      operationId: listAgents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Agent list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    post:
      tags: [Agents]
      summary: Create a company agent.
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/AgentId"
    patch:
      tags: [Agents]
      summary: Update a company agent.
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    delete:
      tags: [Agents]
      summary: Delete a company agent.
      operationId: deleteAgent
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/memory:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Memory]
      summary: List or search company memory.
      operationId: listMemory
      parameters:
        - name: scope
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: latest_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Memory entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    post:
      tags: [Memory]
      summary: Create a memory entry.
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryRequest"
      responses:
        "201":
          description: Created memory entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/agent-chat:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    post:
      tags: [Agent Chat]
      summary: Send a natural-language message to the Company OS agent interface.
      operationId: sendAgentChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
      responses:
        "200":
          description: Agent response and optional thread ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatResponse"
  /api/company/companies/{company_id}/runtime/daemons:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Runtime Daemons]
      summary: List registered local execution daemons for a workspace.
      operationId: listRuntimeDaemons
      responses:
        "200":
          description: Runtime daemon list with computed liveness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/runtime/daemons/register:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    post:
      tags: [Runtime Daemons]
      summary: Register or refresh a local execution daemon.
      operationId: registerRuntimeDaemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRuntimeDaemonRequest"
      responses:
        "200":
          description: Registered daemon.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/runtime/daemons/{device_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [Runtime Daemons]
      summary: Heartbeat a registered local execution daemon.
      operationId: heartbeatRuntimeDaemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRuntimeDaemonRequest"
      responses:
        "200":
          description: Heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/runtime/daemons/{device_id}/deregister:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/DeviceId"
    post:
      tags: [Runtime Daemons]
      summary: Deregister a local execution daemon.
      operationId: deregisterRuntimeDaemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterRuntimeDaemonRequest"
      responses:
        "200":
          description: Deregistration result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/dead-star/contributors:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Dead Star]
      summary: List preserved contributors for the Dead Star ledger.
      operationId: listDeadStarContributors
      responses:
        "200":
          description: Contributor list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
    post:
      tags: [Dead Star]
      summary: Preserve a contributor's judgment profile.
      operationId: createDeadStarContributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeadStarContributorRequest"
      responses:
        "200":
          description: Created contributor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/dead-star/contributors/{contributor_id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ContributorId"
    patch:
      tags: [Dead Star]
      summary: Update a preserved contributor.
      operationId: updateDeadStarContributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated contributor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/dead-star/contributors/{contributor_id}/review:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ContributorId"
    post:
      tags: [Dead Star]
      summary: Review a task using preserved contributor judgment.
      operationId: reviewWithDeadStarContributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadStarReviewRequest"
      responses:
        "200":
          description: Review verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/dead-star/contributors/{contributor_id}/accrue:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/ContributorId"
    post:
      tags: [Dead Star]
      summary: Accrue a royalty ledger event for a preserved contributor.
      operationId: accrueDeadStarRoyalty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeadStarAccrualRequest"
      responses:
        "200":
          description: Royalty event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/dead-star/royalty-ledger:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Dead Star]
      summary: List Dead Star royalty ledger events.
      operationId: listDeadStarRoyaltyLedger
      responses:
        "200":
          description: Royalty ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/dead-star/royalty-events/{event_id}/settle:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Dead Star]
      summary: Mark a Dead Star royalty event settled.
      operationId: settleDeadStarRoyaltyEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Settlement result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/connectors/catalog:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Connectors]
      summary: Get connector catalog.
      operationId: getConnectorCatalog
      responses:
        "200":
          description: Connector catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/connectors/executor/status:
    get:
      tags: [Connectors]
      summary: Get connector executor status.
      operationId: getConnectorExecutorStatus
      responses:
        "200":
          description: Executor status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
  /api/company/companies/{company_id}/agent-runs/{run_id}/execution-events:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Agent Runs]
      summary: List typed action/events for an agent run.
      operationId: listAgentRunExecutionEvents
      parameters:
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
      responses:
        "200":
          description: Monotonic run event stream.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, events]
                properties:
                  run_id:
                    type: string
                    format: uuid
                  last_seq:
                    type: [integer, "null"]
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanyActionEvent"
    post:
      tags: [Agent Runs]
      summary: Append a typed action/event to an agent run.
      operationId: appendAgentRunExecutionEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendCompanyActionEventRequest"
      responses:
        "200":
          description: Appended run event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyActionEvent"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CompanyId:
      name: company_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContributorId:
      name: contributor_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    CompanyActionEvent:
      type: object
      additionalProperties: true
      required: [schema, run_id, event_seq, event_type, ts, payload]
      properties:
        schema:
          type: string
          enum: [hsm.company_os.action_event.v1]
        grammar:
          type: string
          enum: [operator_stream_v1]
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        event_seq:
          type: integer
          minimum: 1
        event_type:
          type: string
        phase:
          type: [string, "null"]
        ts:
          type: string
          format: date-time
        lane:
          type: [string, "null"]
        backend:
          type: [string, "null"]
        model:
          type: [string, "null"]
        tool_name:
